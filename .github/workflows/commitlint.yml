name: Commitlint

on:
  pull_request:
    branches: [main]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    container: node:24-alpine
    steps:
      - run: apk add --no-cache git
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
